name: Benchmark

on:
  push:
    branches: main

jobs:
  benchmark_with_bencher:
    name: Benchmark with Bencher
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    env:
      BENCHER_PROJECT: xml-syntax-reader
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: bencherdev/bencher@main
      - uses: cargo-bins/cargo-binstall@main

      - run: sudo apt update && sudo apt install valgrind

      - name: Install gungraun-runner
        run: |
          version=$(cargo metadata --format-version=1 |\
            jq -r '.packages[] | select(.name == "gungraun").version')
          cargo binstall --no-confirm gungraun-runner --version "$version" --root "$PWD/gungraun/"

      - run: |
          GUNGRAUN_COLOR=never GUNGRAUN_RUNNER=$PWD/gungraun/bin/gungraun-runner cargo bench --bench gungraun > perf.txt

      # Only estimated-cycles gets a Threshold. --thresholds-reset removes any
      # Thresholds on the other Measures, and --ci-only-thresholds keeps those
      # Measures out of the GitHub report, so no "No Threshold found" warning.
      - run: |
          bencher run \
          --branch "$GITHUB_REF_NAME" \
          --hash "$GITHUB_SHA" \
          --testbed ubuntu-24.04 \
          --adapter rust_gungraun \
          --threshold-measure estimated-cycles \
          --threshold-test percentage \
          --threshold-max-sample-size 2 \
          --threshold-upper-boundary 0.02 \
          --thresholds-reset \
          --error-on-alert \
          --github-actions "${{ secrets.GITHUB_TOKEN }}" \
          --ci-only-thresholds \
          --file perf.txt
