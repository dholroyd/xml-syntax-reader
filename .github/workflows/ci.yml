name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # On x86_64 the runtime dispatch picks AVX2, so SSE2 doesn't get a
          # full integration run. The parser is backend-agnostic and the
          # cross_validate_backends unit test verifies all compiled transpose
          # backends produce identical output.

          # x86_64: exercises AVX2
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          # aarch64: exercises NEON
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.3

      - run: cargo test --locked --all-features
      - run: cargo test --locked --all-features --release

  # Check the unsafe SIMD code in src/bitstream under Miri. Only the lib tests
  # are run: the parser modules forbid unsafe code, and the integration tests
  # are far too slow under Miri.
  #
  # Under Miri, is_x86_feature_detected!() reports only the target features
  # enabled at compile time, so the AVX2 backend needs its own run with
  # +avx2. NEON is checked by interpreting the aarch64 target on x86_64.
  miri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sse2
            target: x86_64-unknown-linux-gnu
            rustflags: ""
          - name: avx2
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-feature=+avx2"
          - name: neon
            target: aarch64-unknown-linux-gnu
            rustflags: ""

    runs-on: ubuntu-24.04
    name: miri (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.15.3
        with:
          toolchain: nightly
          components: miri, rust-src

      - run: cargo miri test --locked --all-features --lib --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-D warnings ${{ matrix.rustflags }}"

