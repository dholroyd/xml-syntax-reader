name: Run and Cache Benchmarks

# Runs untrusted PR code without secrets; results are uploaded to Bencher by
# pr-benchmark-upload.yml in the trusted workflow_run context.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - uses: cargo-bins/cargo-binstall@main

      - run: sudo apt update && sudo apt install valgrind

      - name: Install gungraun-runner
        run: |
          version=$(cargo metadata --format-version=1 |\
            jq -r '.packages[] | select(.name == "gungraun").version')
          cargo binstall --no-confirm gungraun-runner --version "$version" --root "$PWD/gungraun/"

      - run: |
          GUNGRAUN_COLOR=never GUNGRAUN_RUNNER=$PWD/gungraun/bin/gungraun-runner cargo bench --bench gungraun > benchmark_results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark_results.txt
          path: ./benchmark_results.txt

      - name: Upload GitHub Pull Request Event
        uses: actions/upload-artifact@v7
        with:
          name: event.json
          path: ${{ github.event_path }}
